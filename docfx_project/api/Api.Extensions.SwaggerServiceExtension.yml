  assemblies:
  - Api
  namespace: Api.Extensions
  summary: Regista e configura o gerador do Swagger no contentor de injeção de dependências.
  remarks: >-
    <b>Configurações incluídas:</b>

    <ul><li>Metadados da API (Título e Versão).</li><li><b>Definição de Segurança:</b> Configura o suporte para autenticação via <b>JWT Bearer Token</b>. Adiciona o botão "Authorize" na UI.</li><li><b>Requisito de Segurança:</b> Define que os endpoints requerem o esquema de segurança configurado.</li><li><b>Comentários XML:</b> Utiliza <xref href="System.Reflection" data-throw-if-not-resolved="false"></xref> para localizar e carregar o ficheiro XML gerado pelo compilador, permitindo que os comentários do código apareçam na documentação web.</li></ul>
  example: []
  syntax:
    content: public static IServiceCollection AddSwaggerDocumentacion(this IServiceCollection services)
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: A coleção de serviços da aplicação.
    return:
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: A coleção de serviços atualizada, permitindo encadeamento (Fluent API).
    content.vb: Public Shared Function AddSwaggerDocumentacion(services As IServiceCollection) As IServiceCollection
  overload: Api.Extensions.SwaggerServiceExtension.AddSwaggerDocumentacion*
