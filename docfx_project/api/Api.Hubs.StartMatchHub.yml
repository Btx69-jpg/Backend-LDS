  assemblies:
  - Api
  namespace: Api.Hubs
  summary: >-
    Método invocado por um cliente (Admin de Equipa) para sinalizar que está pronto para começar o jogo.


    Fluxo:

    1. O cliente envia o ID do jogo e da sua equipa.

    2. Se for o primeiro a chegar, é adicionado ao grupo e fica à espera.

    3. Se for o segundo, o jogo inicia ([result.MatchStarted]) e ambos recebem a notificação [ReceiveStartMatch].
  example: []
  syntax:
    content: public Task JoinStartMatch(Guid idMatch, Guid idTeam)
    parameters:
    - id: idMatch
      type: System.Guid
      description: O ID da partida a iniciar.
    - id: idTeam
      type: System.Guid
      description: O ID da equipa do administrador que está a chamar.
    return:
      type: System.Threading.Tasks.Task
    content.vb: Public Function JoinStartMatch(idMatch As Guid, idTeam As Guid) As Task
  overload: Api.Hubs.StartMatchHub.JoinStartMatch*
  exceptions:
  - type: Microsoft.AspNetCore.SignalR.HubException
    commentId: T:Microsoft.AspNetCore.SignalR.HubException
    description: Se os argumentos forem inválidos ou o estado do jogo não permitir o início.
