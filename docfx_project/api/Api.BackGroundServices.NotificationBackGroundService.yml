  assemblies:
  - Api
  namespace: Api.BackGroundServices
  summary: >-
    Método principal de execução do serviço.

    Contém um loop infinito que executa a lógica de notificação e depois "dorme" por um intervalo definido.
  remarks: >-
    O intervalo de execução está definido para **3 horas**.

    O padrão <code>using (var scope = _scopeFactory.CreateScope())</code> é utilizado para garantir que os serviços

    injetados são descartados corretamente após cada ciclo de execução.
  example: []
  syntax:
    content: protected override Task ExecuteAsync(CancellationToken stoppingToken)
    parameters:
    - id: stoppingToken
      type: System.Threading.CancellationToken
      description: Token de cancelamento para parar o serviço graciosamente.
    return:
      type: System.Threading.Tasks.Task
    content.vb: Protected Overrides Function ExecuteAsync(stoppingToken As CancellationToken) As Task
