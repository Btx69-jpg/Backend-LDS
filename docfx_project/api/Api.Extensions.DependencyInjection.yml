    id: AddApiBackGroundService
    path: ../Api/Extensions/DependencyInjection.cs
    startLine: 38
  assemblies:
  - Api
  namespace: Api.Extensions
  summary: Regista os serviços de plano de fundo (Background Services / Hosted Services) no contentor de DI.
  remarks: >-
    Este método utiliza <code>AddHostedService</code>, o que garante que:

    <ul><li>Os serviços são registados como <b>Singletons</b>.</li><li>O método <code>StartAsync</code> (ou <code>ExecuteAsync</code>) é chamado automaticamente quando a aplicação arranca.</li><li>O método <code>StopAsync</code> é chamado quando a aplicação encerra graciosamente.</li></ul>


    <b>Serviços Registados:</b>

    <ol><li><span class="term"><xref href="Application.Services.BackGroundServices.RankMatchMakerBackGroundService" data-throw-if-not-resolved="false"></xref></span>Responsável pelo algoritmo contínuo de emparelhamento de equipas em jogos competitivos.</li><li><span class="term"><xref href="Api.BackGroundServices.NotificationBackGroundService" data-throw-if-not-resolved="false"></xref></span>Responsável pela verificação periódica e envio de notificações (ex: "Dia de Jogo").</li></ol>
  example: []
  syntax:
    content: public static IServiceCollection AddApiBackGroundService(this IServiceCollection services)
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: A coleção de serviços ([IServiceCollection]) onde os workers serão registados.
    return:
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: A própria coleção de serviços atualizada, permitindo encadeamento de chamadas (Fluent API).
    content.vb: Public Shared Function AddApiBackGroundService(services As IServiceCollection) As IServiceCollection
  overload: Api.Extensions.DependencyInjection.AddApiBackGroundService*
