  nameWithType: FirebaseAuthenticationExtensions.AddFirebaseAuthentication(IServiceCollection, IConfiguration)
  fullName: Api.Extensions.FirebaseAuthenticationExtensions.AddFirebaseAuthentication(Microsoft.Extensions.DependencyInjection.IServiceCollection, Microsoft.Extensions.Configuration.IConfiguration)
  type: Method
  source:
    remote:
      path: Api/Extensions/FirebaseAuthenticationExtension.cs
      branch: documentacion
      repo: https://github.com/Btx69-jpg/Backend-LDS.git
    id: AddFirebaseAuthentication
    path: ../Api/Extensions/FirebaseAuthenticationExtension.cs
    startLine: 31
  assemblies:
  - Api
  namespace: Api.Extensions
  summary: Adiciona e configura os serviços de autenticação do Firebase ao contentor de DI.
  remarks: >-
    O processo de configuração envolve:

    1. Inicialização do SDK Admin do Firebase com credenciais de ficheiro.

    2. Download síncrono inicial das chaves públicas da Google (JWKS).

    3. Configuração do esquema de autenticação [JwtBearer].

    4. Implementação de um [IssuerSigningKeyResolver] personalizado para atualizar as chaves dinamicamente se um token for assinado com uma chave nova.
  example: []
  syntax:
    content: public static Task<IServiceCollection> AddFirebaseAuthentication(this IServiceCollection services, IConfiguration configuration)
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: A coleção de serviços da aplicação.
    - id: configuration
      type: Microsoft.Extensions.Configuration.IConfiguration
      description: A configuração da aplicação (para ler o caminho das credenciais).
    return:
      type: System.Threading.Tasks.Task{Microsoft.Extensions.DependencyInjection.IServiceCollection}
      description: A coleção de serviços atualizada (Fluent API).
    content.vb: Public Shared Function AddFirebaseAuthentication(services As IServiceCollection, configuration As IConfiguration) As Task(Of IServiceCollection)
  overload: Api.Extensions.FirebaseAuthenticationExtensions.AddFirebaseAuthentication*
  exceptions:
  - type: System.IO.FileNotFoundException
    commentId: T:System.IO.FileNotFoundException
    description: Lançada se o ficheiro de credenciais JSON não for encontrado no caminho especificado.
