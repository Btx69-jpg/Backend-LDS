- uid: Api.Extensions.FirebaseAuthenticationExtensions.AddFirebaseAuthentication(Microsoft.Extensions.DependencyInjection.IServiceCollection,Microsoft.Extensions.Configuration.IConfiguration)
  commentId: M:Api.Extensions.FirebaseAuthenticationExtensions.AddFirebaseAuthentication(Microsoft.Extensions.DependencyInjection.IServiceCollection,Microsoft.Extensions.Configuration.IConfiguration)
