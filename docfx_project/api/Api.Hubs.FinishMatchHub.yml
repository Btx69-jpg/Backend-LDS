    path: ../Api/Hubs/FinishMatchHub.cs
    startLine: 46
  assemblies:
  - Api
  namespace: Api.Hubs
  summary: >-
    Método invocado por um cliente (Admin) para submeter o resultado final do jogo.


    Fluxo:

    1. O admin envia o resultado ([ResultMatchDto]).

    2. O serviço armazena o resultado e verifica se a outra equipa já submeteu.

    3. Se ambos submeteram e os resultados coincidem ([result.IsCoincides]), o jogo é finalizado e o grupo é limpo.
  example: []
  syntax:
    content: public Task JoinFinishMatch(ResultMatchDto finishMatch)
    parameters:
    - id: finishMatch
      type: Application.DTOs.Match.ResultMatchDto
      description: DTO contendo os golos e IDs da partida/equipa.
    return:
      type: System.Threading.Tasks.Task
    content.vb: Public Function JoinFinishMatch(finishMatch As ResultMatchDto) As Task
  overload: Api.Hubs.FinishMatchHub.JoinFinishMatch*
  exceptions:
  - type: Microsoft.AspNetCore.SignalR.HubException
    commentId: T:Microsoft.AspNetCore.SignalR.HubException
    description: Se os dados forem inválidos ou o estado do jogo não permitir finalização.
