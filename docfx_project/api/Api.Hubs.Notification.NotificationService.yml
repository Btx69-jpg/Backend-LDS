  summary: Envia uma notificação para um grupo de utilizadores (uma Equipa).
  remarks: >-
    Utiliza o [teamId] como nome do grupo SignalR.

    **Nota:** Certifique-se de que o nome do grupo aqui corresponde à lógica de `Join` no Hub (ex: prefixos).
  example: []
  syntax:
    content: public Task SendTeamAsync(string teamId, string title, string body, object? data = null)
    parameters:
    - id: teamId
      type: System.String
      description: O ID da equipa (nome do grupo) para onde enviar a mensagem.
    - id: title
      type: System.String
      description: O título da notificação.
    - id: body
      type: System.String
      description: O corpo da mensagem.
    - id: data
      type: System.Object
      description: Objeto opcional com dados extra.
    return:
      type: System.Threading.Tasks.Task
