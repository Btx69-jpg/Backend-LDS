  assemblies:
  - Api
  namespace: Api.Hubs.Notification
  summary: Envia uma notificação direcionada a um utilizador específico.
  remarks: >-
    O [userId] deve corresponder ao identificador do utilizador autenticado (ClaimTypes.NameIdentifier)

    mapeado pelo SignalR.
  example: []
  syntax:
    content: public Task SendUserAsync(string userId, string title, string body, object? data = null)
    parameters:
    - id: userId
      type: System.String
      description: O ID do utilizador de destino.
    - id: title
      type: System.String
      description: O título da notificação.
    - id: body
      type: System.String
      description: O corpo da mensagem.
    - id: data
      type: System.Object
      description: Objeto opcional com dados extra (payload) para ser processado pelo cliente.
    return:
      type: System.Threading.Tasks.Task
    content.vb: Public Function SendUserAsync(userId As String, title As String, body As String, data As Object = Nothing) As Task
