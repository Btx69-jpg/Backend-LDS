  assemblies:
  - Infrastructure
  namespace: Infrastructure.Repositories
  summary: Obtém o registo de estatísticas de uma equipa numa partida específica.
  remarks: Utiliza Eager Loading (`.Include`) para carregar a entidade de navegação [Team] associada.
  example: []
  syntax:
    content: public Task<TeamStatistics> GetTeamByIdAndMatch(Guid idMatch, Guid idTeam)
    parameters:
    - id: idMatch
      type: System.Guid
      description: O ID (GUID) da partida.
    - id: idTeam
      type: System.Guid
      description: O ID (GUID) da equipa cujas estatísticas se pretende.
    return:
      type: System.Threading.Tasks.Task{Domain.Entities.TeamStatistics}
      description: A entidade [TeamStatistics] correspondente à combinação da partida e da equipa, ou null.
    content.vb: Public Function GetTeamByIdAndMatch(idMatch As Guid, idTeam As Guid) As Task(Of TeamStatistics)
