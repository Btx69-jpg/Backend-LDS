  assemblies:
  - Api
  namespace: Api.Hubs
  summary: >-
    Método invocado por um cliente para iniciar a procura de jogo (Entrar no Lobby).


    Fluxo:

    1. O cliente envia os critérios de procura ([StartSearchDto]).

    2. O serviço tenta encontrar um par imediato ou adiciona a equipa à fila de espera.

    3. Se encontrar par, notifica ambas as equipas e remove-as do lobby.

    4. Se não encontrar, o cliente fica no grupo à espera de notificações do Background Service.
  example: []
  syntax:
    content: public Task JoinRankMatchMaker(StartSearchDto startSearch)
    parameters:
    - id: startSearch
      type: Application.DTOs.RankMatchMaker.StartSearchDto
      description: DTO com os dados da equipa e preferências de horário.
    return:
      type: System.Threading.Tasks.Task
    content.vb: Public Function JoinRankMatchMaker(startSearch As StartSearchDto) As Task
  overload: Api.Hubs.RankMatchMakerHub.JoinRankMatchMaker*
  exceptions:
  - type: Microsoft.AspNetCore.SignalR.HubException
    commentId: T:Microsoft.AspNetCore.SignalR.HubException
    description: Se os dados de entrada forem inválidos ou a equipa já estiver em jogo.
