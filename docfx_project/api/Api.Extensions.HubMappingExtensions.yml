  assemblies:
  - Api
  namespace: Api.Extensions
  summary: >-
    Mapeia os Hubs SignalR da aplicação para os seus respetivos endpoints HTTP.


    Este método deve ser chamado no pipeline de configuração da aplicação (<code>app</code>) 

    após a construção do host.
  remarks: >-
    <b>Tabela de Endpoints Configurados:</b>

    <table><thead><tr><th class="term">Rota (URL)</th><th class="description">Hub Associado</th></tr></thead><tbody><tr><td class="term"><code>/StartMatch</code></td><td class="description">Gere o handshake inicial e o começo do jogo em tempo real.</td></tr><tr><td class="term"><code>/FinishMatch</code></td><td class="description">Coordena a submissão e validação de resultados finais entre as equipas.</td></tr><tr><td class="term"><code>/MatchMaker</code></td><td class="description">Lobby para procura automática de adversários (Ranked).</td></tr><tr><td class="term"><code>/Notification</code></td><td class="description">Canal genérico para notificações push (ex: Alertas de Jogo).</td></tr></tbody></table>
  example: []
  syntax:
    content: public static WebApplication MapHubs(this WebApplication app)
    parameters:
    - id: app
      type: Microsoft.AspNetCore.Builder.WebApplication
      description: A instância da aplicação web (<xref href="Microsoft.AspNetCore.Builder.WebApplication" data-throw-if-not-resolved="false"></xref>) onde os hubs serão registados.
    return:
      type: Microsoft.AspNetCore.Builder.WebApplication
      description: A instância da aplicação atualizada, permitindo o encadeamento de chamadas (Fluent API).
    content.vb: Public Shared Function MapHubs(app As WebApplication) As WebApplication
