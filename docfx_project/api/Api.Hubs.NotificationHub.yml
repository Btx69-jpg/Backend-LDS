  assemblies:
  - Api
  namespace: Api.Hubs
  summary: >-
    Método invocado por um cliente para subscrever o canal de notificações da sua equipa.


    Fluxo:

    1. Valida se o utilizador autenticado pertence realmente à equipa solicitada ([ValidateTeamMembershipAsync]).

    2. Adiciona a conexão ao grupo SignalR correspondente à equipa.
  example: []
  syntax:
    content: public Task JoinNotificationHub(Guid teamId)
    parameters:
    - id: teamId
      type: System.Guid
      description: O ID da equipa cujas notificações se pretende receber.
    return:
      type: System.Threading.Tasks.Task
    content.vb: Public Function JoinNotificationHub(teamId As Guid) As Task
  overload: Api.Hubs.NotificationHub.JoinNotificationHub*
  exceptions:
  - type: Microsoft.AspNetCore.SignalR.HubException
    commentId: T:Microsoft.AspNetCore.SignalR.HubException
    description: Se o utilizador não tiver permissão ou não pertencer à equipa.
