  nameWithType: RankRepository.AddRankInOtherRankPlaceAsync(Rank, Rank)
  fullName: Infrastructure.Repositories.RankRepository.AddRankInOtherRankPlaceAsync(Domain.Entities.Rank, Domain.Entities.Rank)
  type: Method
  source:
    remote:
      path: Infrastructure/Repositories/RankRepository.cs
      branch: documentacion
      repo: https://github.com/Btx69-jpg/Backend-LDS.git
    id: AddRankInOtherRankPlaceAsync
    path: ../Infrastructure/Repositories/RankRepository.cs
    startLine: 51
  assemblies:
  - Infrastructure
  namespace: Infrastructure.Repositories
  summary: Adiciona um novo Rank, inserindo-o na cadeia hierárquica entre o Rank anterior (implícito) e o [nextRank].
  remarks: >-
    Esta operação é uma transação em duas partes:

    1. Atualiza as FKs do novo Rank (IdNextRank e IdPreviousRank).

    2. Atualiza o [nextRank] para apontar para o novo Rank na sua FK de Rank anterior ([IdPreviousRank]).
  example: []
  syntax:
    content: public Task AddRankInOtherRankPlaceAsync(Rank rank, Rank nextRank)
    parameters:
    - id: rank
      type: Domain.Entities.Rank
      description: O novo Rank a ser inserido.
    - id: nextRank
      type: Domain.Entities.Rank
      description: O Rank que ficará imediatamente acima do novo Rank na hierarquia.
    return:
      type: System.Threading.Tasks.Task
      description: Uma tarefa assíncrona (<xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref>).
    content.vb: Public Function AddRankInOtherRankPlaceAsync(rank As Rank, nextRank As Rank) As Task
  overload: Infrastructure.Repositories.RankRepository.AddRankInOtherRankPlaceAsync*
  implements:
  - Application.Interfaces.Repositories.IRankRepository.AddRankInOtherRankPlaceAsync(Domain.Entities.Rank,Domain.Entities.Rank)
