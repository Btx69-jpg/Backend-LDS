- uid: Infrastructure.Repositories.RankRepository.AddRankInOtherRankPlaceAsync(Domain.Entities.Rank,Domain.Entities.Rank)
  commentId: M:Infrastructure.Repositories.RankRepository.AddRankInOtherRankPlaceAsync(Domain.Entities.Rank,Domain.Entities.Rank)
  id: AddRankInOtherRankPlaceAsync(Domain.Entities.Rank,Domain.Entities.Rank)
